            label: Text
            name: 42c94c54
            widget: text
          - hint: "Original text: La Copa Davis de 2019 reunió a 18 equipos en Madrid en un nuevo formato emocionante. Una semana intensa de partidos ofreció encuentros de alto nivel en una atmósfera vibrante. Esta edición marcó un hito en la historia del torneo, brindando una experiencia única para los aficionados al tenis.\_, key: -20e8e8b0"
